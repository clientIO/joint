         the server root rather than a script-relative path - serve this
         package's root and rewrite that path to
         `node_modules/libavoid-js/dist/libavoid.wasm` (see karma.conf.js's
         `proxies` for the equivalent karma-side fix). -->
    <script type="module" src="./libavoid-loader.mjs"></script>

    <script type="module" src="./index.js"></script>
