name: SonarQube Analysis

# Trigger this workflow on:
on:
  push: # Primarily on push to master branch
    branches:
      - master
  workflow_dispatch: {} # Also allow manual triggering

# Reset permissions and grant them explicitly per job.
permissions: {}

jobs:
  sonarqube:
    if: ${{ github.repository == 'clientIO/joint' }} # Skip for forks
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only - results go to SonarQube, not to GitHub

    steps:
      # Echo run information
      - name: Information
        id: information
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Run information
          | | |
          |---|---|
          | **Triggered by** | `${{ github.event_name }}` |
          | **Workflow branch** | `${{ github.ref_name }}` |
          EOF

      # Checkout contents of joint repo
      - name: Checkout code
        id: checkout-joint
        uses: actions/checkout@v7
        with:
          # Full history for SonarQube blame/SCM attribution (read from the local clone)
          fetch-depth: 0
          persist-credentials: false

      # Install environment packages
      # Fonts - util.breakText - international characters
      - name: Install environment packages
        id: install-environment-packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: |
            fonts-arphic-ukai \
            fonts-arphic-uming \
            fonts-ipafont-mincho \
            fonts-ipafont-gothic \
            fonts-unfonts-core \
            fonts-noto-core
          version: 1.0

      # Set up Node.js version for building
      - name: Setup Node.js v22
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      # Cache Yarn packages to speed up CI
      - name: Cache Yarn
        id: cache-yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      # Install all dependencies from the joint repo
      #
      # `PUPPETEER_SKIP_DOWNLOAD` is what keeps this step green. Four packages
      # depend on `puppeteer`, the `node-modules` linker gives each one a copy
      # of its own, and Yarn runs every copy's `postinstall` concurrently - all
      # four into the one shared `~/.cache/puppeteer`. `@puppeteer/browsers`
      # downloads a browser to a fixed archive path, unpacks it and then deletes
      # it, with no locking, so whichever process gets there first deletes the
      # archive the others are still unpacking and they die on `ENOENT`. The
      # step below installs the same browsers once instead.
      - name: Install dependencies
        id: install-dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: yarn install --immutable

      # The browsers the `postinstall` above would have downloaded, installed
      # once rather than once per package. Naming a browser explicitly is what
      # makes this step ignore `PUPPETEER_SKIP_DOWNLOAD`, and leaving the
      # version off installs the build `puppeteer` itself pins - so this is the
      # same pair, at the same versions, in the same `~/.cache/puppeteer` that
      # `puppeteer.executablePath()` reads (`CHROME_BIN` in the karma configs)
      - name: Install Puppeteer browsers
        id: install-puppeteer-browsers
        run: |
          yarn workspace @joint/core exec puppeteer browsers install chrome
          yarn workspace @joint/core exec puppeteer browsers install chrome-headless-shell

      # Build the joint project (needed for tests)
      - name: Prepare joint
        id: prepare-joint
        run: yarn run dist

      # Evaluate test coverage in the joint project
      # NOTE: Falling below local coverage thresholds aborts the workflow
      - name: Test joint coverage
        id: test-coverage
        run: yarn run test-coverage-lcov

      # Resolve the version to report to SonarQube
      - name: Resolve project version
        id: resolve-project-version
        run: echo "SONAR_PROJECT_VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_ENV

      # Start SonarQube analysis
      - name: SonarQube Scan
        id: sonar-scan
        uses: sonarsource/sonarqube-scan-action@v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Poll SonarQube for analysis results
      - name: SonarQube Quality Gate check
        id: sonar-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
