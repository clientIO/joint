# Tests the script of the Contributor License Agreement check when it changes.
name: CLA test

on:
  pull_request:
    branches: [ "master", "dev" ]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cla-*.yml"

permissions: {}

concurrency:
  group: cla-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the CLA check script
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the CLA check script
        run: node --test ".github/scripts/*.test.cjs"
