# Checks a pull request against the Contributor License Agreement after `cla-trigger.yml`
# ran: the one who opened it, the owner of its fork and every commit author are on the team
# (have access to this repository) or have agreed.
# Sets the `license/cla` status and comments on the pull request when an author has to agree.
#
# `workflow_run` runs this file from the default branch with this repository's token, so
# it must never check out, build or run code of the pull request. It checks out only its
# own script from the default branch and reads the pull request through the API.
name: CLA check

on:
  # Privileged by design (it comments and sets statuses on pull requests from forks); safe
  # because it never checks out or runs pull request code (see above).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ "CLA trigger" ]
    types: [ completed ]

permissions: {}

concurrency:
  group: cla-check-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the CLA of the pull request
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the script and the signatures; the collaborator check of the team
      pull-requests: write # the pull request and its commits; a comment on a pull request needs it too
      issues: write # the comment on the pull request
      statuses: write # the license/cla status
    steps:
      - name: Checkout the check script of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkFromWorkflowRun } = require('./.github/scripts/cla.cjs');
            await checkFromWorkflowRun({ github, context, core });
