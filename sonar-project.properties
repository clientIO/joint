sonar.projectKey=joint
sonar.scm.provider=git

sonar.sources=.

# joint-cli and joint-react colocate their tests inside src, so those trees are
# listed here and narrowed down to the actual test files by sonar.test.inclusions
sonar.tests=packages/joint-core/test,\
    packages/joint-layout-directed-graph/test,\
    packages/joint-layout-msagl/test,\
    packages/joint-vitest-plugin-mock-svg/test,\
    packages/joint-cli/src,\
    packages/joint-react/src
sonar.test.inclusions=**/test/**/*,\
    **/__tests__/**/*

# Exclusions
# **/build/** and **/dist/** are generated by the `yarn run dist` step the Sonar
# workflow runs before scanning; they are gitignored but present on the runner
sonar.exclusions=**/test/**/*,\
    **/__tests__/**/*,\
    **/build/**,\
    **/dist/**,\
    .yarn/**,\
    examples/**,\
    packages/joint-core/demo/**,\
    packages/joint-core/src/polyfills/**,\
    packages/joint-react/__mocks__/**,\
    packages/joint-react/.storybook/**,\
    packages/joint-react/bench/**,\
    packages/joint-react/stories/**,\
    packages/joint-react/src/utils/test-wrappers.tsx

# Coverage
# sonar.javascript.lcov.reportPaths is passed by .github/workflows/sonar.yml, which
# discovers every <workspace>/coverage report at run time; the property does not
# accept a pattern, so listing the reports here would mean naming each workspace.
#
# joint-core and joint-react report coverage; the packages below do not, and without
# these exclusions they would be reported as 0% covered and would fail a "Coverage on
# New Code" condition they are not actually measured by.
sonar.coverage.exclusions=packages/joint-cli/**,\
    packages/joint-decorators/**,\
    packages/joint-eslint-config/**,\
    packages/joint-shapes-general/**,\
    packages/joint-shapes-general-tools/**,\
    packages/joint-vitest-plugin-mock-svg/**
