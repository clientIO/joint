sonar.projectKey=joint
sonar.scm.provider=git

sonar.sources=.

# joint-cli and joint-react colocate their tests inside src, so those trees are
# listed here and narrowed down to the actual test files by sonar.test.inclusions
sonar.tests=packages/joint-core/test,\
    packages/joint-layout-directed-graph/test,\
    packages/joint-layout-msagl/test,\
    packages/joint-vitest-plugin-mock-svg/test,\
    packages/joint-cli/src,\
    packages/joint-react/src
sonar.test.inclusions=**/test/**/*,\
    **/__tests__/**/*

# Exclusions
sonar.exclusions=**/test/**/*,\
    **/__tests__/**/*,\
    .yarn/**,\
    examples/**,\
    packages/joint-core/demo/**,\
    packages/joint-core/src/polyfills/**,\
    packages/joint-react/__mocks__/**,\
    packages/joint-react/.storybook/**,\
    packages/joint-react/bench/**,\
    packages/joint-react/stories/**,\
    packages/joint-react/src/utils/test-wrappers.tsx
